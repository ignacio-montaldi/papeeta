name: papeeta
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.1.1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^9.2.4
  get_it: ^9.2.0
  http: ^1.3.0
  image_picker: ^1.2.1
  provider: ^6.1.4
  pull_to_refresh: ^2.0.0
  url_launcher: ^6.3.2
  flutter_speed_dial: ^7.0.0
  go_router: ^15.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - images/
    - images/app_icon/
    - images/splash/
    - fonts/Inter/

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter/Inter-Regular.ttf
        - asset: fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/app_icon/launcher_icon.png"
  adaptive_icon_background: "#3C1642"
  adaptive_icon_foreground: "images/app_icon/launcher_icon.png"
